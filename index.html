
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/myLogo.svg"
    />

    <!-- SEO -->
    <title>Sarah Ammaireh | Portfolio</title>

    <meta
      name="description"
      content="Explore Sarah Ammaireh's projects in Front-End Development, UI/UX Design, and Mobile Application Development."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Sarah Ammaireh | Portfolio"
    />

    <meta
      property="og:description"
      content="Explore my portfolio featuring creative projects in Front-End Development, UI/UX Design, and Mobile Application Development."
    />

    <meta
      property="og:url"
      content="https://sarahammaireh.pages.dev/"
    />

    <meta
      property="og:image"
      content="https://sarahammaireh.pages.dev/og-image.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sarah Ammaireh Portfolio"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sarah Ammaireh | Portfolio"
    />
    <meta
      name="twitter:description"
      content="Front-End Development, UI/UX Design, and Mobile Projects."
    />
    <meta
      name="twitter:image"
      content="https://sarahammaireh.pages.dev/og-image.png"
    />

    <!-- Theme Initialization -->
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t) {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {
        console.warn("Theme initialization unavailable");
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
