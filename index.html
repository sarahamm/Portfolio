<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/myLogo.svg"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Page Title -->
    <title>Sarah Ammaireh | Portfolio</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Explore Sarah Ammaireh's projects in Front-End Development, UI/UX Design, and Mobile Application Development."
    />

    <!-- Open Graph: LinkedIn and Social Media -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Sarah Ammaireh | Portfolio"
    />

    <meta
      property="og:description"
      content="Explore my portfolio featuring creative projects in Front-End Development, UI/UX Design, and Mobile Application Development."
    />

    <meta
      property="og:url"
      content="https://sarahammaireh.pages.dev/"
    />

    <meta
      property="og:image"
      content="https://sarahammaireh.pages.dev/og-image.png"
    />

    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:alt"
      content="Sarah Ammaireh Portfolio"
    />

    <!-- Theme Initialization -->
    <script>
      const t = localStorage.getItem("theme");
      if (t) {
        document.documentElement.dataset.theme = t;
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
